services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sevenseas
      POSTGRES_USER: sevenseas
      POSTGRES_PASSWORD: sevenseas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    volumes: ["./:/app"]
volumes:
  pgdata:
